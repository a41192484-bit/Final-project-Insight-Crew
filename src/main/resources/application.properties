spring.application.name=TripInsight 
 
# ========================================
#  MariaDB Database Settings
# ========================================
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://192.168.1.16:3306/team?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
# ⚠️ dev/stage 배포 전 IP 수정 필요 (127.0.0.1 / 192.168.1.16)
spring.datasource.username=team
spring.datasource.password=1234 
 
 
# ========================================
#  MyBatis Settings
# ======================================== 
 
# Mapper XML 파일들이 위치한 경로
mybatis.mapper-locations=classpath:mybatis/mapper/**/*.xml 
 
# 도메인(VO/DTO/ENUM 등) 위치 → typeAlias 자동 적용
mybatis.type-aliases-package=com.insightcrew.domain 
 
# (A) snake_case → camelCase 자동 매핑
# DB 컬럼명: trip_id → Java 필드명: tripId 자동 변환
mybatis.configuration.map-underscore-to-camel-case=true 
 
 
# ========================================
#  SQL Logging (디버깅 필수)
#  개발 단계에서 SQL + 파라미터 확인용
# ======================================== 
 
# MyBatis 기본 로그
logging.level.org.mybatis=DEBUG 
 
# JDBC가 실행하는 raw SQL만 출력
logging.level.jdbc.sqlonly=DEBUG 
 
# JDBC ResultSet 출력 (결과 데이터 확인 가능)
logging.level.jdbc.resultsettable=DEBUG 
 
# Spring JDBC 템플릿 실행 로그
logging.level.org.springframework.jdbc.core=DEBUG 
 
 
# ========================================
#  Thymeleaf Settings
# ======================================== 
 
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html 
 
# (C) 개발 중 HTML 캐시 OFF → 파일 수정 시 서버 재시작 없이 즉시 반영
spring.thymeleaf.cache=false