<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
	layout:decorate="~{common/layout}">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>마이페이지</title>

	<style>
		#body {
			/* border: 1px solid; */
			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#mypageMenu {
			border: 1px solid;
			height: auto;
			border-color: royalblue;
			border-radius: 10px;
			background-color: white;
		}

		#catego {
			/* border: 1px solid; */
			height: 500px;
			/* height: auto; */
			/* 항목이 많아지면 위에 height는 지우고 이 auto를 주석 해제하기 */
			width: 480px;

			display: flex;
			/*위에서 아래로 세로 배치.*/
			flex-direction: column;
			/*가로 가운데 정렬*/
			align-items: center;
			text-align: center;
			/* justify-content: center; */
		}

		#catego ul {
			/* border: 1px solid; */
			/*기본 들여쓰기 제거*/
			padding-left: 0;
			/*리스트 불릿 제거*/
			list-style: none;

			font-size: 30px;
			font-weight: 500;
		}

		#catego li {
			padding: 10px 0;
		}

		#catego a {
			/* border: 1px solid; */
			color: royalblue;
			position: relative;
			cursor: pointer;
			text-decoration: none;
		}

		#catego a::after {
			content: "⭐";
			position: absolute;

			left: -40px;
			/*글자 왼쪽에 배치*/
			top: 50%;
			/*중앙 배치*/
			transform: translateY(-50%);
			/*정확히 중앙에 맞추기*/
			opacity: 0;
			transition: opacity 0.3s, right 0.3s;
			font-size: 20px;
		}

		#catego a:hover {
			color: aqua;
		}

		#catego a:hover::after {
			opacity: 1;
			color: aqua;
		}

		#memberOut {
			/* border: 1px solid; */
			font-size: 30px;
			font-weight: 500;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 10px 0;
		}

		.memberOutBtn {
			all: unset;
			/* 버튼 기본 스타일 제거 */
			text-decoration: none;
			color: rgb(167, 167, 167);
			position: relative;
			cursor: pointer;

			font-size: 30px;
			font-weight: 500;
		}

		.memberOutBtn::after {
			content: "⭐";
			position: absolute;
			left: -40px;
			/*글자 왼쪽에 배치*/
			top: 50%;
			/*중앙 배치*/
			transform: translateY(-50%);
			/*정확히 중앙에 맞추기*/
			opacity: 0;
			transition: opacity 0.3s, right 0.3s;
			font-size: 20px;
		}

		.memberOutBtn:hover {
			color: crimson;
		}

		.memberOutBtn:hover::after {
			opacity: 1;
			/* left: -30px; */
		}

		#logout {
			/* border: 1px solid; */
			border-top: royalblue 1px solid;
			height: 100px;
			width: 480px;

			font-size: 30px;
			font-weight: 500;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		.logout-btn {
			all: unset;
			color: rgb(92, 92, 92);
			font-size: 30px;
			font-weight: 500;
			position: relative;
			cursor: pointer;
		}

		.logout-btn::after {
			content: "⭐";
			position: absolute;
			left: -40px;
			/*글자 왼쪽에 배치*/
			top: 50%;
			/*중앙 배치*/
			transform: translateY(-50%);
			/*정확히 중앙에 맞추기*/
			opacity: 0;
			transition: opacity 0.3s, right 0.3s;
			font-size: 20px;
		}

		.logout-btn:hover {
			color: blue;
		}

		.logout-btn:hover::after {
			opacity: 1;
			/* left: -30px; */
		}
	</style>
</head>



<body>
	<div layout:fragment="content">

		<div id="body">
			<div id="mypageMenu">
				<div id="catego">
					<ul>
						<li id="memberInfo">
							<a th:href="@{/member/info}">정보 관리</a>
						</li>
					</ul>
				</div>

				<div id="memberOut">
					<form th:action="@{/member/inactive}" method="post">
						<button	type="submit" class="memberOutBtn">회원탈퇴</button>
					</form>
				</div>

				<div id="logout">
					<form th:action="@{/auth/logout}" method="post">
						<button type="submit" class="logout-btn">로그아웃</button>
					</form>
				</div>

			</div>
		</div>
	</div>





	<script>


	</script>
</body>

</html>
