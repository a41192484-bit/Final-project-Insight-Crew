<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원정보</title>

    <style>
        #body {
            /* border: 1px solid; */
            height: 700px;
            width: 960px;

            /* 가로 가운데 정렬 */
            display: flex;
            align-items: center;
        }

        #back {
            /* border: 1px solid; */
            height: 600px;
            width: 240px;
            text-align: right;
        }

        #back a {
            /* border: 1px solid; */
            margin: 40px;
            font-size: 20px;
            color: gray;
            text-decoration: none;
        }

        #back a:hover {
            color: blueviolet;
            font-weight: 700;
        }

        #joinInfo {
            border: 1px solid;
            border-color: royalblue;
            border-radius: 10px;

            height: 600px;
            width: 480px;
            background-color: white;
        }

        #title {
            /* border: 1px solid; */
            height: 60px;
            margin: 15px;
            color: royalblue;
            background-color: #dce7ff;
            border-radius: 10px;

            font-size: 25px;
            font-weight: bold;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #infoList {
            /* border: 1px solid; */
            height: 490px;
            margin: 15px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #infoList ul {
            /*기본 들여쓰기 제거*/
            padding-left: 0;
            /*리스트 불릿 제거*/
            list-style: none;

            font-size: 20px;

            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        #infoList .label {
            /* border: 1px solid; */
            color: royalblue;
            font-weight: 600;
            display: inline-block;
            width: 100px;
            text-align: right;
        }

        #infoList input {
            width: 180px;
            padding: 6px;
        }

        li {
            /* border: 1px solid; */
            /* 가운데 정렬 */
            display: flex;
            align-items: center;

            gap: 20px;
        }

        li button {
            /* border: 1px solid; */
            border-radius: 10px;
            width: 80px;
            height: 30px;
            font-weight: 500;
            color: darkgreen;
        }

        li button:hover {
            background-color: #dddcff;
            color: deeppink;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">

        <div id="body">
            <div id="back">
                <a th:href="@{/mypage/view}">◀ 뒤로가기</a>
            </div>
			
			
			<form th:action="@{/member/info}" method="post">
            <div id="joinInfo">
                <div id="title">
                    <span>◈ 정보 조회 ◈</span>
                </div>
                <div id="infoList">
                    <ul>
                        <li>
                            <span class="label">아이디 :</span>
                            <span id="displayId">Loading...</span>
                        </li>
                        <li>
                            <span class="label">비밀번호 :</span>
                            <span id="displayPW">Loading...</span>
                            <button type="button" class="editBtn" data-target="PW">수정</button>
                        </li>
                        <li>
                            <span class="label">이름 :</span>
                            <span id="displayUsername">Loading...</span>
                            <button type="button" class="editBtn" data-target="Username">수정</button>
                        </li>
                        <li>
                            <span class="label">닉네임 :</span>
                            <span id="displayNickname">Loading...</span>
                            <button type="button" class="editBtn" data-target="Nickname">수정</button>
                        </li>
                    </ul>
                </div>
            </div>
			</form>
			
			
        </div>
    </div>

	
	
	
	
	
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            //html에서 찾아서 js 변수에 가져온다
            const displayId = document.getElementById("displayId");
            const displayPW = document.getElementById("displayPW");
            const displayUsername = document.getElementById("displayUsername");
            const displayNickname = document.getElementById("displayNickname");

            //각각의 textContent에 데이터를 넣어서 초기화면 셋팅
            displayId.textContent = user.id;
            displayPW.textContent = "*".repeat(user.password.length);
            displayUsername.textContent = user.name;
            displayNickname.textContent = user.nickName;

            //수정버튼 누를 때
            document.querySelectorAll(".editBtn").forEach(btn => {
                btn.addEventListener("click", function () {
                    //수정버튼이 있는 것: PW, Username, Nickname
                    const modTarget = btn.dataset.target;

                    let spanId; //span 변수
                    let original;  //원래 화면에 있던 텍스트 변수

                    //조건: 버튼명이 수정 이라면?
                    if (btn.textContent === "수정") {
                        //span 아이디명 찾기
                        spanId = document.getElementById(`display${modTarget}`);
                        //초기값
                        if (modTarget === "PW") {
                            original = userData.password
                        } else {
                            original = spanId.textContent
                        };

                        //input 생성
                        const input = document.createElement("input");
                        //조건 ? "참":"거짓"
                        input.type = modTarget === "PW" ? "password" : "text";
                        //유저가 수정할 값
                        input.value = original;

                        //span->input으로 교체
                        spanId.replaceWith(input);

                        //버튼 텍스트를 '확인'으로 변경
                        btn.textContent = "저장";
                    } else if (btn.textContent === "저장") {
                        //버튼의 부모속성에서 input요소 첫번째 한 개를 찾기
                        const input = btn.parentElement.querySelector("input");
                        const newValue = input.value;

                        //userData에 저장
                        if (modTarget === "PW") {
                            userData.password = newValue;
                        } else if (modTarget === "Username") {
                            userData.name = newValue;
                        } else if (modTarget === "Nickname") {
                            userData.nickname = newValue;
                        }

                        //span 복원
                        const newSpan = document.createElement("span");
                        newSpan.id = 'display${modTarget}'

                        if (modTarget === "PW") {
                            newSpan.textContent = "*".repeat(newValue.length);
                        } else {
                            newSpan.textContent = newValue;
                        }

                        input.replaceWith(newSpan);

                        //버튼 원래대로
                        btn.textContent = "수정";
                    }
                });
            });
        });
    </script>

</body>

</html>
