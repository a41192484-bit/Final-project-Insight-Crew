<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>TripInsight - 메인</title>

    <style>
        /* ================= 기본 레이아웃 ================= */
        main {
            background: #fafafa;
            padding: 0 0 60px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* ================= Hero ================= */
        .hero {
            width: 100%;
            background: linear-gradient(135deg, #c7d2ff, #e3dfff);
            padding: 60px 0;
            text-align: center;
            border-radius: 25px;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 24px;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
        }

        .hero-sub {
            font-size: 15px;
            color: white;
            opacity: .9;
        }

        /* ================== 드롭다운 ================== */
        .region-box {
            background: white;
            font-size: 14px;
            display: block;
            position: relative;
            z-index: 5;
        }

        .region-box option {
            background: white;
            color: black;
        }

        /* ================== TOP5 ================== */
        .top {
            width: 720px;
            margin: 0 auto 40px;
        }

        .top-cards {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
        }

        .top-card {
            flex: 0 0 150px;
            background: white;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 10px rgba(140, 140, 180, 0.20);
        }

        .top-card img {
            width: 100%;
            height: 110px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 8px;
        }

        .top-name {
            font-size: 14px;
            font-weight: 600;
            color: #4f54a8;
            margin-bottom: 4px;
        }

        .top-score {
            font-size: 13px;
            color: #999;
        }

        .top-more-btn {
            display: block;
            margin: 16px auto 0;
            width: 150px;
            padding: 8px 18px;
            text-align: center;
            background: #6F73FF;
            color: white;
            border-radius: 18px;
            font-size: 14px;
            text-decoration: none;
        }

        .top-more-btn:hover {
            opacity: .85;
        }

        /* ================= 공통 Section ================= */
        .section {
            width: 720px;
            margin: 40px auto;
            background: white;
            border-radius: 20px;
            padding: 24px;
            box-shadow: 0 4px 15px rgba(100, 100, 140, 0.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: #6F73FF;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .section-title span {
            font-size: 20px;
        }
    </style>
</head>

<body>
<main layout:fragment="content">

    <!-- HERO -->
    <section class="hero">
        <div class="hero-title">오늘 떠나기 좋은 여행지 ✨</div>
        <div class="hero-sub">당장 떠날 수 있는 여행지 추천을 만나보세요</div>
    </section>

    <!-- ====================== 지역 선택 ====================== -->
    <section class="section" style="margin-top:0;">
        <div class="section-title"><span>📍</span> 지역 선택</div>

        <form action="/" method="get" id="regionForm" style="display:flex; gap:10px;">

            <!-- 시도 -->
            <select id="sidoSelect" name="sido" class="region-box"
                    style="flex:1; padding:10px; border-radius:10px; border:1px solid #dad9ff;">
                <option value="">시/도 선택</option>
                <option th:each="r : ${sidoList}"
                        th:value="${r}"
                        th:text="${r}"
                        th:selected="${selectedSido == r}">
                </option>
            </select>

            <!-- 시군구 -->
            <select id="sigunguSelect" name="sigungu" class="region-box"
                    style="flex:1; padding:10px; border-radius:10px; border:1px solid #dad9ff;">
                <option value="">시/군/구 선택</option>
                <option th:each="g : ${sigunguList}"
                        th:value="${g}"
                        th:text="${g}"
                        th:selected="${selectedSigungu == g}">
                </option>
            </select>

            <!-- 조회 버튼 유지 -->
            <button type="submit"
                    style="padding:10px 20px; background:#6F73FF; color:white; border:none;
                           border-radius:10px; font-weight:600;">
                조회
            </button>
        </form>
    </section>

    <!-- ====================== TOP 5 ====================== -->
    <section class="top">
        <div class="top-cards">
            <div class="top-card" th:each="trip:${topTrips}">
                <img th:src="${trip.imageUrl}">
                <div class="top-name" th:text="${trip.title}"></div>
                <div class="top-score">TOP <span th:text="${trip.rankNo}"></span></div>
            </div>
        </div>

        <a href="/trip/list" class="top-more-btn">전체 여행지 보기</a>
    </section>


    <!-- ====================== SCRIPT ====================== -->
    <script>
        document.addEventListener("DOMContentLoaded", function () {

            const sidoSelect = document.getElementById("sidoSelect");
            const sigunguSelect = document.getElementById("sigunguSelect");

            // 시도 변경 시 자동 시군구 로딩
            sidoSelect.addEventListener("change", function () {
                const sido = this.value;

                sigunguSelect.innerHTML = "<option value=''>시/군/구 선택</option>";

                if (!sido) return;

                fetch(`/api/regions/sigungu?sido=${encodeURIComponent(sido)}`)
                    .then(res => res.json())
                    .then(list => {
                        list.forEach(g => {
                            sigunguSelect.innerHTML += `<option value="${g}">${g}</option>`;
                        });
                    })
                    .catch(err => console.error("시군구 로딩 실패:", err));
            });

        });
    </script>

</main>
</body>
</html>
