<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>TripInsight - 메인</title>

    <style>
        /* ================= 공통 ================= */
        main { background:#f4f6ff; padding-bottom:60px; }
		.section {
		    padding: 0 20px;
		    margin-bottom: 60px;
		}

        /* ================= HERO ================= */
		.hero {
			overflow-x: hidden;
		    position: relative;
		    text-align: center;
		    padding: 72px 20px 80px;

		    background: linear-gradient(
		        120deg,
		        #d7dcff 0%,
		        #c9d0ff 35%,
		        #eef0ff 55%,
		        #c9d0ff 75%,
		        #d7dcff 100%
		    );
		    background-size: 300% 300%;
		    animation: heroShimmer 5s ease-in-out infinite;
		}
		
		@keyframes heroShimmer {
		    0%   { background-position: 0% 50%; }
		    50%  { background-position: 100% 50%; }
		    100% { background-position: 0% 50%; }
		}
		
		.hero::after {
		    content: "";
		    position: absolute;
		    top: 0;
		    left: -80%;
		    width: 80%;
		    height: 100%;

		    background: linear-gradient(
		        120deg,
		        transparent 0%,
		        rgba(255,255,255,0.55) 50%,
		        transparent 100%
		    );

		    animation: heroLight 6s ease-in-out infinite;
		    pointer-events: none;
		}
		
		@keyframes heroLight {
		    0%   { left: -80%; opacity: 0; }
		    20%  { opacity: 1; }
		    45%  { left: 120%; opacity: 0; }
		    100% { left: 120%; opacity: 0; }
		}
		
		.hero-title {
		    font-size: 30px;
		    font-weight: 800;
		    color: #3f45a6;
		    letter-spacing: -0.3px;
		}

		.hero-sub {
		    margin-top: 8px;
		    font-size: 15px;
		    color: #555aa8;
		}

		.sparkle {
		    display: inline-block;
		    margin-left: 6px;
		    animation: sparkle 2s infinite ease-in-out;
		    transform-origin: center;
		}

		@keyframes sparkle {
		    0%   { transform: scale(1) rotate(0deg); opacity: 0.6; }
		    50%  { transform: scale(1.25) rotate(10deg); opacity: 1; }
		    100% { transform: scale(1) rotate(0deg); opacity: 0.6; }
		}
		
		.hero-divider {
		    width: 60px;
		    height: 3px;
		    background: #6F73FF;
		    margin: 24px auto 0;
		    border-radius: 999px;
		}
		
		/* ================= RANKING ================= */

		.ranking-grid {
		    display: grid;
		    grid-template-columns: repeat(5, 1fr);
		    gap: 16px;
		}

		.ranking-card {
		    background: #fff;
		    border-radius: 18px;
		    box-shadow: 0 4px 14px rgba(150,150,200,.15);
		    overflow: hidden;
		    text-align: center;
			transition: transform .25s ease, box-shadow .25s ease;

		}
		
		.ranking-card:hover {
		    transform: translateY(-6px);
		    box-shadow: 0 10px 26px rgba(111,115,255,.25);
		}

		/* 이미지 영역 */
		.ranking-image {
		    position: relative;
		    height: 120px;
		    overflow: hidden;
		}

		.ranking-image img {
		    width: 100%;
		    height: 100%;
		    object-fit: cover;
		}
		
		.ranking-link {
		    text-decoration: none;
		    color: inherit;
		}

		/* 🔥 추천 번호 뱃지 */
		.recommend-badge {
		    position: absolute;
		    top: 10px;
		    left: 10px;

		    width: 26px;
		    height: 26px;
		    border-radius: 50%;

		    background: #6F73FF;
		    color: #fff;
		    font-size: 13px;
		    font-weight: 700;

		    display: flex;
		    align-items: center;
		    justify-content: center;

		    box-shadow: 0 3px 8px rgba(111,115,255,.35);
		    z-index: 2;
		}

		/* 카드 하단 정보 */
		.ranking-info {
		    padding: 12px 10px 14px;
		    min-height: 56px;   /* ⭐ 핵심 */
		    display: flex;
		    align-items: center;
		    justify-content: center;
		}

		.ranking-title {
		    font-weight: 700;
		    font-size: 14px;
		    color: #333;
		    line-height: 1.4;

		    display: -webkit-box;
		    -webkit-line-clamp: 2;   /* 최대 2줄 */
		    -webkit-box-orient: vertical;
		    overflow: hidden;
		}

        /* ================= REGION SEARCH ================= */
        .region-search {
            display:flex;
            gap:10px;
            margin:10px 0 26px;
        }
        .region-search select,
        .region-search button {
            padding:10px 12px;
            border-radius:12px;
            border:1px solid #ccc;
            font-size:14px;
        }
        .region-search button {
            background:#6F73FF;
            color:#fff;
            font-weight:700;
            border:none;
            cursor:pointer;
        }

        /* ================= WEATHER ================= */
        .weather-title {
            font-size:22px;
            font-weight:700;
            color:#4f54a8;
            margin:10px 0 18px;
        }
        .today-weather {
            background:linear-gradient(145deg,#eef0ff,#fff);
            border:2px solid #6F73FF;
            border-radius:20px;
            padding:22px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            box-shadow:0 4px 14px rgba(150,150,200,.15);
            margin-bottom:25px;
        }
        .today-temp { font-size:32px; font-weight:800; color:#6F73FF; }

		.week-weather{
		    display:grid;
		    grid-template-columns: repeat(6, 1fr);
		    gap:12px;
		}
		
		.week-card{
		    background:#fff;
		    border-radius:16px;
		    padding:14px 0;
		    text-align:center;
		    box-shadow:0 4px 14px rgba(150,150,200,.15);
		}
		
        .week-card.today {
            background:linear-gradient(145deg,#eef0ff,#fff);
            border:2px solid #6F73FF;
        }
		
		/* ================= BOARD ================= */

		.board-list {
		    background: #fff;
		    border-radius: 18px;
		    box-shadow: 0 4px 14px rgba(150,150,200,.15);
		    overflow: hidden;
		}

		.board-item {
		    display: flex;
		    align-items: center;
		    gap: 10px;

		    padding: 14px 18px;
		    border-bottom: 1px solid #eee;
		    font-size: 14px;
		}

		.board-item:last-child {
		    border-bottom: none;
		}

		.board-category {
		    font-size: 12px;
		    color: #6F73FF;
		    font-weight: 700;
		}

		.board-title {
		    flex: 1;
		    color: #333;
		    white-space: nowrap;
		    overflow: hidden;
		    text-overflow: ellipsis;
		}

		.board-date {
		    font-size: 12px;
		    color: #999;
		}
    </style>
</head>

<body>
<main layout:fragment="content">

    <!-- HERO -->
    <section class="hero">
		<div class="hero-title">
		    오늘, 떠나기 좋은 여행지
		    <span class="sparkle">✨</span>
		</div>
		<div class="hero-sub">날씨 기반 전국 여행지 추천 서비스</div>
		
		<div class="hero-divider"></div>
    </section>
	
	<!-- ================= RANKING ================= -->
	<section class="section ranking-section">
	    <div class="weather-title">🔥 오늘의 여행지 추천</div>

	    <div class="ranking-grid">
			<th:block th:each="trip, stat : ${rankingList}">
			    <a th:href="@{/trip/detail/{id}(id=${trip.tripId})}"
			       class="ranking-link">

			        <div class="ranking-card">
			            <div class="ranking-image">
			                <div class="recommend-badge"
			                     th:text="${stat.index + 1}"></div>

								 <img th:src="${#strings.isEmpty(trip.imageUrl) ? '/img/no-image.png' : trip.imageUrl}"
								      th:classappend="${#strings.isEmpty(trip.imageUrl)} ? 'no-img' : ''"
								      onerror="this.onerror=null; this.src='/img/no-image.png'"
								      alt="여행지 이미지">
			            </div>

			            <div class="ranking-info">
			                <div class="ranking-title"
			                     th:text="${trip.title}">여행지명</div>
			            </div>
			        </div>

			    </a>
			</th:block>
	    </div>
	</section>

    <!-- WEATHER -->
    <section class="section">
        <div class="weather-title">☀️ 오늘 & 주간 날씨</div>

        <!-- REGION SEARCH -->
        <div class="region-search">
            <select id="sidoSelect">
                <option value="">시/도 선택</option>
                <option th:each="sido : ${sidoList}"
                        th:value="${sido}"
                        th:text="${sido}"
                        th:selected="${sido == selectedSido}">
                </option>
            </select>

            <select id="sigunguSelect">
                <option value="">시/군/구 선택</option>
            </select>

            <button type="button" id="searchWeatherBtn">검색</button>
        </div>

        <!-- TODAY -->
        <div class="today-weather">
            <div class="today-temp"
                 th:text="${todayWeather.temp + '°C'}">--°C</div>
            <div>
                <span th:switch="${todayWeather.sky}">
                    <span th:case="'맑음'">☀️</span>
                    <span th:case="'구름많음'">🌤️</span>
                    <span th:case="'흐림'">☁️</span>
                    <span th:case="'눈'">❄️</span>
                    <span th:case="*">🌧️</span>
                </span>
                <span th:text="' 풍속 ' + ${todayWeather.wind} + 'm/s · 강수 ' + ${todayWeather.rain} + '%'"></span>
            </div>
        </div>

		<!-- WEEKLY -->
		<!-- SHORT TERM (내일 · 모레) -->
		<div class="week-weather">

		    <div class="week-card" th:each="w : ${weeklyWeather}">

		        <!-- 요일 -->
		        <div style="font-weight:700;"
		             th:text="${#temporals.format(w.date,'E')}"></div>

		        <!-- 아이콘 -->
		        <div style="font-size:18px;margin:4px 0;">
		            <span th:switch="${w.sky}">
		                <span th:case="'맑음'">☀️</span>
		                <span th:case="'구름많음'">🌤️</span>
		                <span th:case="'흐림'">☁️</span>
		                <span th:case="'눈'">❄️</span>
		                <span th:case="*">🌧️</span>
		            </span>
		        </div>

		        <!-- 하늘 상태 -->
		        <div style="font-size:13px;color:#666;"
		             th:text="${w.sky}"></div>

		        <!-- 최고 / 최저 -->
		        <div style="margin-top:6px;font-weight:600;">
		            <span style="color:#ff5a5a;"
		                  th:text="${w.tempHigh != null ? w.tempHigh + '°' : '--'}"></span>
		            /
		            <span style="color:#4a6cff;"
		                  th:text="${w.tempLow != null ? w.tempLow + '°' : '--'}"></span>
		        </div>

		        <!-- 강수 -->
		        <div style="margin-top:4px;font-size:12px;color:#888;"
		             th:text="'강수 ' + ${w.rain} + '%'"></div>

		    </div>

		</div>
    </section>

	<!-- ================= BOARD ================= -->
	<section class="section">
	    <div class="weather-title">📝 커뮤니티 최신글</div>

	    <div class="board-list">
	        <th:block th:each="board : ${latestBoards}">
	            <div class="board-item">
	                <span class="board-category"
	                      th:text="${board.category}">공지</span>

	                <span class="board-title"
	                      th:text="${board.title}">
	                    게시글 제목
	                </span>

	                <span class="board-date"
	                      th:text="${#temporals.format(board.createdAt,'MM.dd')}">
	                    12.15
	                </span>
	            </div>
	        </th:block>
	    </div>
	</section>

<!-- ================= JS ================= -->
<script>
document.getElementById("sidoSelect").addEventListener("change", function () {
    const sido = this.value;
    const sigunguSelect = document.getElementById("sigunguSelect");

    sigunguSelect.innerHTML = '<option value="">시/군/구 선택</option>';
    if (!sido) return;

    fetch(`/api/regions/sigungu?sido=${encodeURIComponent(sido)}`)
        .then(res => res.json())
        .then(data => {
            data.forEach(sigungu => {
                const opt = document.createElement("option");
                opt.value = sigungu;
                opt.textContent = sigungu;
                if (sigungu === "[[${selectedSigungu}]]") {
                    opt.selected = true;
                }
                sigunguSelect.appendChild(opt);
            });
        });
});

// 최초 로딩 시 시군구 자동 세팅 (선택 유지)
window.addEventListener("DOMContentLoaded", () => {
    const sido = document.getElementById("sidoSelect").value;
    if (sido) {
        document.getElementById("sidoSelect").dispatchEvent(new Event("change"));
    }
});

document.getElementById("searchWeatherBtn").addEventListener("click", () => {
    const sido = document.getElementById("sidoSelect").value;
    const sigungu = document.getElementById("sigunguSelect").value;

    if (!sido || !sigungu) {
        alert("지역을 선택해주세요");
        return;
    }

    location.href = `/?sido=${encodeURIComponent(sido)}&sigungu=${encodeURIComponent(sigungu)}`;
});
</script>

</main>

</body>
</html>
