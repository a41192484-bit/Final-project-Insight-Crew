<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>TripInsight - 메인</title>

    <style>
        /* ================= 공통 ================= */
        main {
            background: #f4f6ff;
            padding-bottom: 60px;
        }

        /* layout이 이미 960px 잡고 있으므로 여기선 width 금지 */
        .section {
            padding: 0 20px;
        }

        /* ================= HERO ================= */
        .hero {
            background: linear-gradient(145deg, #b6c0ff, #e3d7ff);
            padding: 80px 20px 100px;
            text-align: center;
            border-radius: 0 0 40px 40px;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        .hero-sub {
            font-size: 15px;
            color: #fff;
            opacity: .95;
        }

        /* ================= TOP 5 ================= */
        .top-title {
            font-size: 22px;
            font-weight: 700;
            color: #4f54a8;
            margin-bottom: 20px;
        }

        .top-cards {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .top-cards::-webkit-scrollbar {
            height: 6px;
        }

        .top-card {
            flex: 0 0 200px;
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        .top-number {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #6F73FF;
            color: #fff;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .top-name {
            font-size: 15px;
            font-weight: 600;
            color: #4f54a8;
        }

        .top-more {
            text-align: center;
            margin-top: 25px;
        }

        .top-more a {
            display: inline-block;
            padding: 10px 28px;
            background: #6F73FF;
            color: #fff;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
        }

        /* ================= WEATHER ================= */
        .weather-title {
            font-size: 22px;
            font-weight: 700;
            color: #4f54a8;
            margin: 50px 0 18px;
        }

        .today-weather {
            background: #fff;
            border-radius: 20px;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
            margin-bottom: 25px;
        }

        .today-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .today-icon {
            font-size: 40px;
        }

        .today-temp {
            font-size: 32px;
            font-weight: 800;
            color: #6F73FF;
        }

        .today-desc {
            font-size: 14px;
            color: #666;
        }

        .week-weather {
            display: flex;
            gap: 12px;
        }

        .week-card {
            flex: 1;
            background: #fff;
            border-radius: 16px;
            padding: 14px 0;
            text-align: center;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
        }

        .week-day {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .week-icon {
            font-size: 24px;
            margin-bottom: 6px;
        }

        .week-temp {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>
<main layout:fragment="content">

    <!-- HERO -->
    <section class="hero">
        <div class="hero-title">오늘 떠나기 좋은 여행지 ✨</div>
        <div class="hero-sub">날씨 기반 전국 여행지 추천 서비스</div>
    </section>

    <!-- TOP 5 -->
    <section class="section">
        <div class="top-title">오늘의 추천 여행지 TOP 5</div>

        <div class="top-cards">
            <a class="top-card"
               th:each="trip, iter : ${topTrips}"
               th:href="@{/trip/detail/{id}(id=${trip.tripId})}">
                <div class="top-number" th:text="${iter.index + 1}">1</div>
                <img th:src="${trip.imageUrl}">
                <div class="top-name" th:text="${trip.title}">여행지</div>
            </a>
        </div>

        <div class="top-more">
            <a href="/trip/list">전체 여행지 보기</a>
        </div>
    </section>

    <!-- WEATHER -->
    <section class="section">
        <div class="weather-title">오늘 & 주간 날씨 ☀️</div>

        <div class="today-weather">
            <div class="today-left">
                <div class="today-icon">🌤️</div>
                <div>
                    <div class="today-temp">23°C</div>
                    <div class="today-desc">전국 대체로 맑음</div>
                </div>
            </div>
            <div class="today-desc">풍속 2.1m/s · 강수확률 10%</div>
        </div>

        <div class="week-weather">
            <div class="week-card"><div class="week-day">월</div><div class="week-icon">☀️</div><div class="week-temp">25° / 15°</div></div>
            <div class="week-card"><div class="week-day">화</div><div class="week-icon">🌤️</div><div class="week-temp">24° / 14°</div></div>
            <div class="week-card"><div class="week-day">수</div><div class="week-icon">🌦️</div><div class="week-temp">22° / 16°</div></div>
            <div class="week-card"><div class="week-day">목</div><div class="week-icon">☁️</div><div class="week-temp">21° / 15°</div></div>
            <div class="week-card"><div class="week-day">금</div><div class="week-icon">☀️</div><div class="week-temp">26° / 17°</div></div>
        </div>
    </section>

</main>
</body>
</html>
