<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title layout:title-pattern="$CONTENT_TITLE - TripInsight">공통 템플릿</title>

	<style>
		/* 네 CSS 그대로 유지 */
		/* body {
            /* border: 1px solid; 
            margin: 10px auto;
            width: 960px;
            height: auto;
        } */

		body {
			margin: 0;
			width: 100%;
			display: flex;
			justify-content: center;
		}

		#layout-container {
			width: 960px;
			margin: 0 auto;
		}

		#header {
			border: 1px solid;
			border-color: royalblue;
			margin: 20px auto;
			width: 960px;
			display: flex;
		}

		#logo {
			/* border: 1px solid; */
			width: 200px;
			height: 100px;
			background-color: #868FEE;
			/* background-color: #7480FF; */

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
		}

		#menu {
			/* border: 1px solid; */
			height: 100px;
			width: 760px;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		}

		#menu ul {
			/* border: 1px solid; */
			padding-left: 0;
			/*기본 들여쓰기 제거*/
		}

		#menu a {
			position: relative;
			color: black;
			text-decoration: none;
			cursor: pointer;
		}

		#menu a::after {
			content: "⭐";
			position: absolute;
			top: -19px;
			/*글자 바로 위 배치*/
			left: 50%;
			/*중앙 배치*/
			transform: translateX(-50%);
			/*정확히 중앙에 맞추기*/
			opacity: 0;
			transition: 0.2s ease;
			font-size: 14px;
		}

		#menu a:hover {
			/* color: #5C63FF; */
			color: mediumspringgreen;
		}

		#menu a:hover::after {
			opacity: 1;
		}

		#menu1 {
			/* border: 1px solid; */
			height: 100px;
			width: 570px;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		}

		#menu1 li {
			list-style: none;
			/*리스트 불릿 제거*/
			/* border: 1px solid; */
			height: 90px;

			margin: 0 30px;
			width: 190px;
			font-size: 18px;
			font-weight: bold;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		}

		#menu2 {
			/* border: 1px solid; */
			height: 100px;
			width: 190px;
			background-color: #fffedc;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		}

		#menu2 li {
			list-style: none;
			/*리스트 불릿 제거*/
			/* border: 1px solid; */
			height: 90px;

			margin: 0 30px;
			width: 210px;
			font-size: 18px;
			font-weight: bold;

			/* 가운데 정렬 */
			display: flex;
			justify-content: center;
			align-items: center;
			text-align: center;
		}

		#footer {
			/* border: 1px solid; */
			border-top: 1px solid;
			border-color: royalblue;

			margin-top: 20px auto;
			height: 150px;
			width: 960px;
			display: block;
			background-color: white;
		}

		#footUp {
			/* border: 1px solid; */
			height: 50px;
			width: 960px;
			margin: 10px auto;
			text-align: center;
			gap: 40px;

			display: flex;
			justify-content: center;
			align-items: center;
		}

		#footUp a {
			color: black;
			text-decoration: none;
		}

		#footUp a:hover {
			/* color: rebeccapurple; */
			color: mediumspringgreen;
		}

		#footdown {
			/* border: 1px solid; */
			height: 50px;
			width: 960px;
			margin: 20px auto;

			display: flex;
			justify-content: center;
			align-items: center;
		}
	</style>
</head>

<body>

	<div id="layout-container">
		<!-- 🔵 공통 Header -->
		<header>
			<div id="header">
				<div id="logo">
					<img src="/img/headerLogo.PNG" alt="헤더 로고">
				</div>

				<div id="menu">
					<ul id="menu1">
						<li><a href="">홈</a></li>
						<li><a href="">여행지</a></li>
						<li><a href="">자유게시판</a></li>
					</ul>
					<ul id="menu2">
						<!-- 로그인 전 -->
						<li sec:authorize="isAnonymous()">
							<a th:href="@{/auth/view}">로그인/회원가입</a>
						</li>

						<!-- 로그인 후 -->
						<li sec:authorize="!isAnonymous()">
							<a th:href="@{/member/member-mypage}">마이페이지</a>
						</li>
					</ul>
				</div>
			</div>
		</header>


		<!-- 🟢 여기로 자식 페이지 내용이 들어옴 -->
		<main layout:fragment="content">
			<!-- 비워둠 -->
		</main>


		<!-- 🔵 공통 Footer -->
		<footer>
			<div id="footer">
				<div id="footUp">
					<a href="">1:1문의</a>
					<a href="">공지사항</a>
					<a href="">Q&A</a>
					<a href="">사이트 소개</a>
				</div>
				<div id="footdown">
					<img src="/img/footerLogo.PNG" alt="푸터 로고">
				</div>
			</div>
		</footer>
	</div>
	
	<th:block layout:fragment="script"></th:block>

</body>

</html>
