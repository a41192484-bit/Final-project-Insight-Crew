<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <title>TripInsight - 메인</title>

    <style>
        /* ================= 공통 ================= */
        main {
            background: #f4f6ff;
            padding-bottom: 60px;
        }

        .section {
            padding: 0 20px;
        }

        /* ================= HERO ================= */
        .hero {
            background: linear-gradient(145deg, #b6c0ff, #e3d7ff);
            padding: 80px 20px 100px;
            text-align: center;
            border-radius: 0 0 40px 40px;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 30px;
            font-weight: 800;
            color: #fff;
            margin-bottom: 12px;
        }

        .hero-sub {
            font-size: 15px;
            color: #fff;
            opacity: .95;
        }

        /* ================= TOP 5 ================= */
        .top-title {
            font-size: 22px;
            font-weight: 700;
            color: #4f54a8;
            margin-bottom: 20px;
        }

        .top-cards {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding-bottom: 10px;
        }

        .top-card {
            flex: 0 0 200px;
            background: #fff;
            border-radius: 16px;
            padding: 14px;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
            text-decoration: none;
            color: inherit;
            position: relative;
        }

        .top-number {
            position: absolute;
            top: -10px;
            left: -10px;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #6F73FF;
            color: #fff;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .top-card img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .top-name {
            font-size: 15px;
            font-weight: 600;
            color: #4f54a8;
        }

        .top-more {
            text-align: center;
            margin-top: 25px;
        }

        .top-more a,
        .top-more button {
            display: inline-block;
            padding: 10px 28px;
            background: #6F73FF;
            color: #fff;
            border-radius: 20px;
            text-decoration: none;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        /* ================= WEATHER ================= */
        .weather-title {
            font-size: 22px;
            font-weight: 700;
            color: #4f54a8;
            margin: 50px 0 18px;
        }

        .today-weather {
            background: #fff;
            border-radius: 20px;
            padding: 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
            margin-bottom: 25px;
        }

        .today-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .today-temp {
            font-size: 32px;
            font-weight: 800;
            color: #6F73FF;
        }

        .week-weather {
            display: flex;
            gap: 12px;
        }

        .week-card {
            flex: 1;
            background: #fff;
            border-radius: 16px;
            padding: 14px 0;
            text-align: center;
            box-shadow: 0 4px 14px rgba(150,150,200,.15);
        }
    </style>
</head>

<body>
<main layout:fragment="content">

    <!-- HERO -->
    <section class="hero">
        <div class="hero-title">오늘 떠나기 좋은 여행지 ✨</div>
        <div class="hero-sub">날씨 기반 전국 여행지 추천 서비스</div>
    </section>

    <!-- TOP 5 -->
    <section class="section">
        <div class="top-title">오늘의 추천 여행지 TOP 5</div>

        <!-- 🔥 버튼 -->
        <div class="top-more">
            <button id="loadRankingBtn">추천 여행지 보기 ✨</button>
        </div>

        <!-- 🔥 비어있는 영역 -->
        <div id="rankingArea" style="display:none; margin-top:20px;">
            <div class="top-cards" id="rankingList"></div>

            <div class="top-more">
                <a href="/trip/list">전체 여행지 보기</a>
            </div>
        </div>
    </section>

    <!-- WEATHER -->
    <section class="section">
        <div class="weather-title">오늘 & 주간 날씨 ☀️</div>

        <div class="today-weather">
            <div class="today-left">
                <div class="today-temp">23°C</div>
            </div>
            <div>풍속 2.1m/s · 강수확률 10%</div>
        </div>

        <div class="week-weather">
            <div class="week-card">월 ☀️ 25° / 15°</div>
            <div class="week-card">화 🌤️ 24° / 14°</div>
            <div class="week-card">수 🌦️ 22° / 16°</div>
            <div class="week-card">목 ☁️ 21° / 15°</div>
            <div class="week-card">금 ☀️ 26° / 17°</div>
        </div>
    </section>

    <script>
        document.getElementById("loadRankingBtn").addEventListener("click", function () {

            fetch("/api/ranking/top5")
                .then(res => res.json())
                .then(list => {

                    const box = document.getElementById("rankingList");
                    const area = document.getElementById("rankingArea");

                    box.innerHTML = "";

                    list.forEach((t, idx) => {
                        box.innerHTML += `
                            <a class="top-card" href="/trip/detail/${t.tripId}">
                                <div class="top-number">${idx + 1}</div>
                                <img src="${t.imageUrl || '/img/no-image.png'}">
                                <div class="top-name">${t.title}</div>
                            </a>
                        `;
                    });

                    area.style.display = "block";
                    this.style.display = "none";
                });
        });
    </script>

</main>
</body>
</html>
