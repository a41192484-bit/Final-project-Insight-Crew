<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>

    <style>
        body {
            /* border: 1px solid; */
            margin: 10px auto;
            width: 960px;
            height: auto;
        }

        #header {
            border: 1px solid;
            border-color: royalblue;
            margin: 20px auto;
            width: 960px;
            display: flex;
        }

        #logo {
            /* border: 1px solid; */
            width: 200px;
            height: 100px;
            background-color: #868FEE;
            /* background-color: #7480FF; */

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #menu {
            /* border: 1px solid; */
            height: 100px;
            width: 760px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #menu ul {
            /* border: 1px solid; */
            /*기본 들여쓰기 제거*/
            padding-left: 0;
        }

        #menu a {
            position: relative;
            color: black;
            text-decoration: none;
            cursor: pointer;
        }

        #menu a::after {
            content: "⭐";
            position: absolute;
            top: -19px;
            /*글자 바로 위 배치*/
            left: 50%;
            /*중앙 배치*/
            transform: translateX(-50%);
            /*정확히 중앙에 맞추기*/
            opacity: 0;
            transition: 0.2s ease;
            font-size: 14px;
        }

        #menu a:hover {
            /* color: #5C63FF; */
            color: mediumspringgreen;
        }

        #menu a:hover::after {
            opacity: 1;
        }

        #menu1 {
            /* border: 1px solid; */
            height: 100px;
            width: 570px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #menu1 li {
            list-style: none;
            /*리스트 불릿 제거*/
            /* border: 1px solid; */
            height: 90px;

            margin: 0 30px;
            width: 190px;
            font-size: 18px;
            font-weight: bold;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #menu2 {
            /* border: 1px solid; */
            height: 100px;
            width: 190px;
            background-color: #fffedc;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #menu2 li {
            list-style: none;
            /*리스트 불릿 제거*/
            /* border: 1px solid; */
            height: 90px;

            margin: 0 30px;
            width: 210px;
            font-size: 18px;
            font-weight: bold;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #footer {
            /* border: 1px solid; */
            border-top: 1px solid;
            border-color: royalblue;

            margin-top: 20px;
            height: 150px;
            width: 960px;
            display: block;
            background-color: white;
        }

        #footUp {
            /* border: 1px solid; */
            height: 50px;
            width: 960px;
            margin: 10px auto;
            text-align: center;
            gap: 40px;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #footUp a {
            color: black;
            text-decoration: none;
        }

        #footUp a:hover {
            /* color: rebeccapurple; */
            color: mediumspringgreen;
        }

        #footdown {
            /* border: 1px solid; */
            height: 50px;
            width: 960px;
            margin: 20px auto;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        #body {
            /* border: 1px solid; */
            height: 700px;
            width: 960px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joinBox {
            border: 1px solid;
            border-color: royalblue;
            border-radius: 10px;

            height: 600px;
            width: 550px;
            background-color: white;
        }

        #joinTitle {
            /* border: 1px solid; */
            height: 60px;
            margin: 15px;
            color: royalblue;
            background-color: #dce7ff;
            border-radius: 10px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: bold;
        }

        #joinList {
            /* border: 1px solid; */
            border-color: royalblue;
            border-radius: 10px;
            height: 400px;
            margin: 15px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #inputInfo label {
            /* border: 1px solid; */
            display: flex;
            align-items: center;
            gap: 20px;
            color: royalblue;
        }

        #inputInfo label {
            /* border: 1px solid; */
            display: inline-block;
            width: 130px;
            text-align: right;
        }

        #inputInfo input {
            width: 200px;
            padding: 6px;
        }

        #inputInfo ul {
            /* border: 1px solid; */
            /*기본 들여쓰기 제거*/
            padding-left: 0;
            /*리스트 불릿 제거*/
            list-style: none;

            font-weight: 550;
            font-size: 20px;

            display: flex;
            flex-direction: column;
            gap: 40px;
        }

        li {
            /* border: 1px solid; */
            /* 가운데 정렬 */
            display: flex;
            align-items: center;

            gap: 20px;
        }

        li button {
            /* border: 1px solid; */
            border-radius: 10px;
            width: 80px;
            height: 30px;
            font-weight: 500;
            color: brown;
        }

        li button:hover {
            background-color: #ffe9a6;
            color: blue;
        }

        #joinBtn {
            /* border: 1px solid; */
            border-top: 1px solid;
            border-color: royalblue;
            margin: 0 15px;

            /* 가운데 정렬 */
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #joinBtn button {
            font-size: 15px;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 30px;
            margin-top: 20px;

            background-color: #dce7ff;
            border-color: royalblue;
        }

        #joinBtn button:hover {
            background-color: royalblue;
            color: white;
        }
    </style>
</head>

<body>
    <div layout:fragment="content">

        <div id="body">
			
			<form th:action="@{/auth/auth-join}" method="post" onsubmit="return validateJoin(event)">
            <div id="joinBox">
                <div id="joinTitle">
                    <span>◈ 회원가입 ◈</span>
                </div>
				
                <div id="joinList">
                    <div id="inputInfo">
                        <ul>
                            <li>
                                <label for="userid">아이디 :</label>
                                <input type="text" id="userid" name="userid" placeholder="이메일 형식으로 입력">
                                <button type="button" onclick="checkIdBtn()">중복확인</button>
                            </li>
                            <li>
                                <label for="password">비밀번호 :</label>
                                <input type="text" id="password" name="password" placeholder="비밀번호 입력">
                            </li>
                            <li>
                                <label for="passCheck">비밀번호 확인 :</label>
                                <input type="text" id="passCheck" placeholder="비밀번호 확인">
                            </li>
                            <li>
                                <label for="name">이름 :</label>
                                <input type="text" id="name" name="name" placeholder="이름 입력">
                            </li>
                            <li>
                                <label for="nickname">닉네임 :</label>
                                <input type="text" id="nickname" name="nickname" placeholder="닉네임 입력">
                                <button type="button" onclick="checkNickBtn()">중복확인</button>
                            </li>
                        </ul>
                    </div>
                </div>
                <div id="joinBtn">
                    <button type="submit">시작하기</button>
                </div>
            </div>
			</form>
			
			
        </div>

    </div>




    <script src="menu.js"></script>
    <script>
		function validateJoin(){
			const userid = document.getElementById("userid").value;
			const password = document.getElementById("password").value;
			const passCheck = document.getElementById("passCheck").value;
			const name = document.getElementById("name").value;
			
			if(!userid || !password || !name){
				alert("입력하지 않은 필수 항목이 있습니다.");
				return false;
			}
			
			if(password !== passCheck){
				alert("비밀번호가 일치하지 않습니다.");
				return false;
			}
			return true;
		}
		
        //id 중복확인
        function checkIdBtn() {
            const userId = document.getElementById("userid").value;

            //encodeURIComponent: 특수문자, 공백 등을 깨지지 않게 안전한 형태로 바꾸는 역할 
            fetch(`/auth/check-id?userid=${encodeURIComponent(userId)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        alert("이미 사용 중인 아이디입니다.");
                    } else {
                        alert("사용 가능한 아이디입니다.");
                    }
                });
        }

		//닉네임 중복 확인
        function checkNickBtn() {
            const nickName = document.getElementById("nickname").value;

            fetch(`/auth/check-nick?nickname=${encodeURIComponent(nickName)}`)
                .then(res => res.json())
                .then(data => {
                    if (data.exists) {
                        alert("이미 사용 중인 닉네임입니다.");
                    } else {
                        alert("사용 가능한 닉네임입니다.");
                    }
                });
        }
		

    </script>

</body>

</html>
