<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
    layout:decorate="~{common/layout}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>

    <style>
        .search-area-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .search-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #select {
            width: 100px;
            height: 40px;
        }

        #search {
            width: 400px;
            height: 40px;
            padding-left: 10px;
        }

        button {
            border: none;
            background: none;
            cursor: pointer;
        }

        #button img {
            width: 40px;
            height: 40px;
        }

        table {
            width: 960px;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background-color: rgb(181, 187, 255);
            padding: 10px;
        }

        td {
            text-align: center;
            padding: 10px;
        }

        tr {
            border-bottom: 1px solid #ccc;
        }

        tr:last-child {
            border-bottom: none;
        }

        .status-done {
            background-color: rgba(255, 253, 222, 1);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: #7a780dff;
        }

        .status-wait {
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: bold;
            color: #555;
            background-color: white;
        }

        #board-actions {
            width: 960px;
            margin: 20px auto 10px auto;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            background-color: rgb(148, 157, 255);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }

        .action-btn:hover {
            opacity: 0.9;
        }

        #page {
            margin-top: 30px;
            margin-bottom: 50px;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }

        .page-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div layout:fragment="content">

        <div class="board">
            <h1>1:1문의</h1>
            <span style="font-size:20px; color:#555;">문의를 할 수 있습니다</span>
        </div>

        <hr>

        <div class="search-area-wrapper">
            <div class="search-area">
                <select id="select">
                    <option value="">제목</option>
                    <option value="">작성자</option>
                    <option value="">내용</option>
                </select>

                <input type="text" id="search" placeholder="검색어를 입력하세요">

                <button id="button" onclick="alert('검색합니다!')">
                    <img src="img/1.png" alt="검색">
                </button>
            </div>
        </div>

        <table>
            <tr>
                <th>카테고리</th>
                <th>문의 제목</th>
                <th>작성자</th>
                <th>등록일</th>
                <th>상태</th>
            </tr>

            <tr>
                <td>회원가입문의</td>
                <td>글 제목 1</td>
                <td>작성자1</td>
                <td>2025-11-20</td>
                <td><span class="status-done">답변완료</span></td>
            </tr>
            <tr>
                <td>기타문의</td>
                <td>글 제목 2</td>
                <td>작성자2</td>
                <td>2025-11-19</td>
                <td><span class="status-wait">답변대기</span></td>
            </tr>
            <tr>
                <td>여행지문의</td>
                <td>글 제목 3</td>
                <td>작성자3</td>
                <td>2025-11-18</td>
                <td><span class="status-done">답변완료</span></td>
            </tr>
            <tr>
                <td>기타문의</td>
                <td>글 제목 4</td>
                <td>작성자4</td>
                <td>2025-11-17</td>
                <td><span class="status-wait">답변대기</span></td>
            </tr>
            <tr>
                <td>여행지문의</td>
                <td>글 제목 5</td>
                <td>작성자5</td>
                <td>2025-11-16</td>
                <td><span class="status-done">답변완료</span></td>
            </tr>
        </table>

        <div id="board-actions">
            <button class="action-btn">문의하기</button>
        </div>

        <div id="page">
            <button class="page-btn">이전</button>
            <div> 1 2 3 4 5</div>
            <button class="page-btn">다음</button>
        </div>

    </div>


</body>

</html>
